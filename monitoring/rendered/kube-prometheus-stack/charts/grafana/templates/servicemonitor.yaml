---
# Source: kube-prometheus-stack/charts/grafana/templates/servicemonitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: monitoring-grafana
  namespace: monitoring
  labels:
    release: "monitoring"
    helm.sh/chart: grafana-14.6.0
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: monitoring
    app.kubernetes.io/version: "13.3.2"
spec:
  endpoints:
  - port: http-web
    honorLabels: true
    path: /metrics
    scheme: http
  jobLabel: "monitoring"
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: monitoring
  namespaceSelector:
    matchNames:
      - monitoring

